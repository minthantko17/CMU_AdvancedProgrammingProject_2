name = PropertiesConfig
appender.console.type = Console
appender.console.name = consoleLogger
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%5p] %d{yyyy-MM-dd HH:mm:ss} Method: %M [Line: %L] [%t] %c{1} - %msg%n

appender.file.type = File
appender.file.name = fileLogger
appender.file.filename = logs/app.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = [%5p] %d{yyyy-MM-dd HH:mm:ss} [time %r ms] [%t] %c{1} [%M Line: %L] - %msg%n

rootLogger.level = debug
rootLogger.appenderRef.stderr.ref = consoleLogger
rootLogger.appenderRef.file.ref = fileLogger